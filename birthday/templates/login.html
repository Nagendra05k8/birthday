<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise 🎁</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

    <!-- Animated background -->
    <div class="stars"></div>

    <div class="login-container">

        <div class="gift">🎁</div>

        <p class="small-title">
            Someone prepared a little surprise for you...
        </p>

        <h1>
            Are You Ready? ✨
        </h1>

        <p class="subtitle">
            Enter the details below to unlock your birthday surprise 💫
        </p>


        <form action="/surprise" method="POST">

            <div class="input-group">

                <label for="roll_no">
                    🎓 Roll Number
                </label>

                <input
                    type="text"
                    id="roll_no"
                    name="roll_no"
                    placeholder="Enter your roll number"
                    required
                >

            </div>


            <div class="input-group">

                <label for="birthday">
                    🎂 Birthday
                </label>

                <input
                    type="date"
                    id="birthday"
                    name="birthday"
                    required
                >

            </div>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            <button type="submit">

                Get Surprise Buddy
                <span>✨</span>

            </button>

        </form>

        <p class="hint">
            Something beautiful is waiting behind this button... 💖
        </p>

    </div>


    <script
        src="{{ url_for('static', filename='js/login.js') }}">
    </script>

</body>

</html>
